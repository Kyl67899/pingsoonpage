<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <title>Ping Coming Soon Page</title>
</head>

<body>
  <div class="container">
    <h1 class="logo">
      <img src="./images/logo.svg" alt="ping-logo" />
    </h1>
    <h2 class="headline">We are launching <span>soon!</span></h2>
    <p class="subtext">Subscribe and get notified.</p>

    <form class="form" id="form" novalidate>
      <div class="input-group">
        <label for="email" class="visually-hidden">Email Address</label>
        <input type="email" id="email" placeholder="Your email address..." required />
        <small class="error-message">
          Please provide a valid email address
        </small>
      </div>
      <button type="submit">Notify Me</button>
    </form>

    <div class="mockup">
      <img class="" src="./images/illustration-dashboard.png" alt="illustration dashboard" />
    </div>

    <footer>
      &copy; Copyright Ping. All rights reserved.
      <div class="icons">
        <a>
          <i class="bi bi-facebook"></i>
        </a>
        <a>
          <i class="bi bi-twitter"></i>
        </a>
        <a>
          <i class="bi bi-instagram"></i>
        </a>
      </div>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">
          Frontend Mentor
        </a>
        Coded by
        <a href="https://kylepprofile.dev">Kyle Parsotan</a>
      </div>
    </footer>
  </div>

  <script src="js.js"></script>
</body>

</html>
